[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "market-analysis-mvp"
version = "0.1.0"
description = "NIFTY 500 market analysis tool with personalized buy/hold/sell recommendations"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "sqlalchemy[asyncio]==2.0.30",
    "alembic==1.13.1",
    "apscheduler==3.10.4",
    "yfinance==0.2.40",
    "alpha_vantage==2.3.1",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "pandas-ta==0.3.14b0",
    "psycopg2-binary==2.9.9",
    "httpx==0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.1",
    "hypothesis==6.104.1",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.hypothesis]
# Applied via @settings(max_examples=100) in each test file,
# but we set a global profile here as a baseline.
max_examples = 100
suppress_health_check = ["too_slow"]
